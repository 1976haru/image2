name: image2 foundation checks

on:
  push:
    branches: ['feature/**', 'main']
  pull_request:

jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (no models, no GPU)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q story_image_studio tools tests test_foundation
      - name: Read-only diagnostic unit tests
        run: python -m unittest discover -s test_foundation -p "test_*.py" -v
      - name: Studio tests (synthetic fixtures, mocked ComfyUI)
        run: python -m pytest -q
